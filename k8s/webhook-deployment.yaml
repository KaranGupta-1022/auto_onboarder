apiVersion: v1
kind: Namespace
metadata:
  name: ghostkube
---
# The webhook-server-tls Secret is deliberately NOT defined here. Create it from
# the real cert files so private key material never lands in a tracked manifest:
#
#   kubectl create secret tls webhook-server-tls \
#     --cert=server.crt --key=server.key -n ghostkube
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ghostkube-webhook
  namespace: ghostkube
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ghostkube-webhook
  template:
    metadata:
      labels:
        app: ghostkube-webhook
    spec:
      containers:
        - name: webhook
          image: ghostkube/webhook:dev   # build+load to kind or push to registry
          imagePullPolicy: IfNotPresent  # use the image side-loaded via `kind load`
          ports:
            - containerPort: 443
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: webhook-server-tls
---
apiVersion: v1
kind: Service
metadata:
  name: ghostkube-webhook-svc
  namespace: ghostkube
spec:
  selector:
    app: ghostkube-webhook
  ports:
    - port: 443
      targetPort: 443
      protocol: TCP
