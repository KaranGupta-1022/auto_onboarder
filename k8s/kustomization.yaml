apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - webhook-deployment.yaml
  # caBundle is still the literal placeholder PLACEHOLDER_CA_BUNDLE_BASE64 in
  # this file - `kubectl apply -k k8s/` will apply it as-is. Substitute the
  # real CA bundle first with the Phase 8 sed pipe, or re-apply just this
  # file afterward:
  #
  #   CA_BUNDLE=$(base64 -w0 ca.crt)
  #   sed "s|PLACEHOLDER_CA_BUNDLE_BASE64|${CA_BUNDLE}|" k8s/mutatingwebhook.yaml | kubectl apply -f -
  - mutatingwebhook.yaml
  - chroma-statefulset.yaml
  - api-config.yaml
  - api-deployment.yaml
