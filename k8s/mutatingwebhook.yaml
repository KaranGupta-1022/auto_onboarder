apiVersion: admissionregistration.k8s.io/v1
kind: MutatingWebhookConfiguration
metadata:
  name: ghostkube-pod-mutator
webhooks:
  - name: pod-mutator.ghostkube.example.com
    admissionReviewVersions: ["v1"]
    sideEffects: None
    timeoutSeconds: 10
    failurePolicy: Ignore   # use Ignore for dev, Fail for strict production
    clientConfig:
      service:
        name: ghostkube-webhook-svc
        namespace: ghostkube
        path: /mutate
      caBundle: PLACEHOLDER_CA_BUNDLE_BASE64
    # Only invoke the webhook for pods that actually opt in via the GhostKube
    # label. Without this the API server calls us on every pod creation
    # cluster-wide, including kube-system.
    objectSelector:
      matchExpressions:
        - key: ghostkube.io/service
          operator: Exists
    rules:
      - operations: ["CREATE"]
        apiGroups: [""]
        apiVersions: ["v1"]
        resources: ["pods"]